      C 69.5 14.5, 74.2 18.2, 78.8 21.3
      C 83.4 24.4, 88.6 27.2, 92.2 31.4
      C 95.8 35.6, 97.4 41.2, 99.8 46.2
      C 102.2 51.2, 105.8 55.8, 106.6 61.3
      C 107.4 66.8, 105.3 72.3, 104.3 77.8
      C 103.3 83.3, 103.3 89.2, 100.8 94.1
      C 98.3 99.0, 93.3 102.4, 89.6 106.3
      C 85.9 110.2, 83.1 115.1, 78.1 117.4
      C 73.1 119.7, 67.5 119.1, 62.1 119.4
      C 56.7 119.7, 51.2 121.0, 46.1 119.1
      C 41.0 117.2, 37.3 112.7, 33.0 109.3
      C 28.7 105.9, 23.3 103.1, 20.3 98.5
      C 17.3 93.9, 17.1 88.0, 15.6 82.7
      C 14.1 77.4, 11.2 72.4, 11.6 66.8
      C 12.0 61.2, 15.6 56.4, 17.7 51.3
      C 19.8 46.2, 20.3 40.3, 23.7 35.9
      C 27.1 31.5, 32.8 29.1, 37.4 25.8
      C 42.0 22.5, 46.2 18.1, 51.7 16.0
      C 57.2 13.9, 58.5 14.5, 64 14.5 Z"
      fill="#ffffff"/>

    <!-- Inner Stamp Circle (Rose / Crimson Stamp Ink) -->
    <circle cx="64" cy="64" r="38" fill="#f43f5e"/>

    <!-- Concentric Inner Stamp Ring (White) -->
    <circle cx="64" cy="64" r="33" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="0"/>

    <!-- Verified / Checkmark Stamp Mark (White) -->
    <path d="M 50 65 L 60 75 L 80 52"
          fill="none"
          stroke="#ffffff"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
